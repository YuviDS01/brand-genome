services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: brandgenome
      POSTGRES_PASSWORD: brandgenome
      POSTGRES_DB: brandgenome
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      # Server-side (SSR/server component) fetches run inside this
      # container, where "localhost" doesn't reach the backend container --
      # they need the Docker network's service name instead. Client-side
      # (browser) fetches use NEXT_PUBLIC_API_BASE_URL (baked in at build
      # time, above) since the browser runs on the host, not in Docker.
      INTERNAL_API_BASE_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata: